services:
  mysql:
    image: mysql:8.4
    container_name: autique-local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autique_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - autique-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autique-local-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - autique-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autique-mysql-data:
  autique-redis-data:
