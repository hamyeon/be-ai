plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vintic'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Day10 관측성: experiment-api/experiment-worker 한정 Micrometer -> CloudWatch export
	// (CloudWatchMetricsConfig). Spring Boot 3.x는 CloudWatch metrics export를 자동 구성하지
	// 않으므로(management.cloudwatch.metrics.export.*는 우리가 직접 바인딩하는 임의의 키) 이
	// registry는 항상 직접 만든 @Configuration을 통해서만 등록된다.
	implementation 'io.micrometer:micrometer-registry-cloudwatch2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// 배포된 서버의 상태(DB·Redis 연결)를 밖에서 확인할 수단. 지금은 API를 직접 찔러보는 방법뿐이다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	runtimeOnly 'com.h2database:h2'
	// Day10 배포 실패 원인: micrometer-registry-cloudwatch2가 AWS SDK v2 2.31.78 계열을
	// 끌어오면서 여기 s3/sqs 2.25.11과 섞여 DefaultS3Presigner.presignPutObject()에서
	// NPE가 났다(ClientEndpointProvider.isEndpointOverridden(), "ep" is null). BOM으로
	// 전체 AWS SDK v2 모듈 버전을 하나로 맞춘다.
	implementation platform('software.amazon.awssdk:bom:2.31.78')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sqs'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// experiment-api/experiment-worker 프로필 전용 스키마 migration(V1/V2, db/migration).
	// local/dev는 spring.flyway.enabled=false(application.yml)로 그대로 ddl-auto=update를 쓴다.
	implementation 'org.flywaydb:flyway-mysql'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:localstack'

	// #75-4A: 자체 Access/Refresh JWT 발급/검증. spring-security-oauth2-client/Kakao SDK는
	// 추가하지 않는다 - Kakao는 REST 호출(#75-4B)로만 신원을 확인하고, 이후 인증은 이 JWT로 한다.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// #75-4B: @WebMvcTest에 실제 SecurityFilterChain을 적용해 검증하기 위한 공식 테스트 전용
	// companion(spring-boot-starter-security의 짝) - 새 인증 library가 아니다.
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()

	// 커맨드라인 -D 옵션은 Gradle JVM에만 설정된다. 테스트는 별도 JVM에서 돌기 때문에
	// 명시적으로 넘겨주지 않으면 Vision 하네스 옵션(-Dvision.harness*)이 전달되지 않고
	// 테스트가 조용히 skip된다.
	def harnessProperties = System.properties.findAll { it.key.toString().startsWith('vision.harness') }
	harnessProperties.each { key, value -> systemProperty(key.toString(), value.toString()) }

	if (!harnessProperties.isEmpty()) {
		// 하네스는 실제 API를 호출해 매번 새 수치를 내는 게 목적이다.
		// UP-TO-DATE로 건너뛰면 두 번째 실행부터 아무것도 안 하고 성공만 찍힌다.
		outputs.upToDateWhen { false }

		// Gradle은 테스트의 System.out을 기본으로 숨긴다. 하네스는 출력이 곧 결과물이라
		// 이걸 켜지 않으면 수 분을 기다린 끝에 BUILD SUCCESSFUL만 보게 된다.
		testLogging {
			showStandardStreams = true
			// 케이스마다 몇 초씩 걸려서, 진행 표시가 없으면 멈춘 것처럼 보인다.
			events 'started', 'passed', 'failed'
		}
	}
}
