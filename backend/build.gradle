plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vintic'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	runtimeOnly 'com.h2database:h2'
	implementation 'software.amazon.awssdk:s3:2.25.11'
	runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()

	// 커맨드라인 -D 옵션은 Gradle JVM에만 설정된다. 테스트는 별도 JVM에서 돌기 때문에
	// 명시적으로 넘겨주지 않으면 Vision 하네스 옵션(-Dvision.harness*)이 전달되지 않고
	// 테스트가 조용히 skip된다.
	def harnessProperties = System.properties.findAll { it.key.toString().startsWith('vision.harness') }
	harnessProperties.each { key, value -> systemProperty(key.toString(), value.toString()) }

	if (!harnessProperties.isEmpty()) {
		// 하네스는 실제 API를 호출해 매번 새 수치를 내는 게 목적이다.
		// UP-TO-DATE로 건너뛰면 두 번째 실행부터 아무것도 안 하고 성공만 찍힌다.
		outputs.upToDateWhen { false }

		// Gradle은 테스트의 System.out을 기본으로 숨긴다. 하네스는 출력이 곧 결과물이라
		// 이걸 켜지 않으면 수 분을 기다린 끝에 BUILD SUCCESSFUL만 보게 된다.
		testLogging {
			showStandardStreams = true
			// 케이스마다 몇 초씩 걸려서, 진행 표시가 없으면 멈춘 것처럼 보인다.
			events 'started', 'passed', 'failed'
		}
	}
}
