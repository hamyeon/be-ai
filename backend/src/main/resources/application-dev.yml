spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 공유 RDS. EC2로 SSH 포트포워딩을 열어두고 접속한다.
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update # 자바 코드로 테이블을 정의하면 DB에 알아서 테이블을 만들어주는 옵션
    show-sql: true

# 배포 환경 관리 엔드포인트.
#
# 관리 포트(기본 8081)는 보안그룹에서 외부 인바운드를 막는 것이 전제다.
# 그 전까지는 8080만 열려 있어도 8081이 열려 있으면 지표가 그대로 노출된다.
management:
  endpoint:
    health:
      # 포트 차단이 확인되기 전까지는 상세 정보를 열지 않는다.
      # 차단이 확인되면 MANAGEMENT_HEALTH_DETAILS=always로 올려도 된다.
      show-details: ${MANAGEMENT_HEALTH_DETAILS:never}
