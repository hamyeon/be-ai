spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # docker-compose.local.yml로 띄운 로컬 MySQL. 공유 RDS와 완전히 분리된 연결.
    url: jdbc:mysql://localhost:3306/autique_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}

# 로컬에서는 관리 엔드포인트를 서비스 포트에서 그대로 쓴다.
# 포트 분리는 배포 환경에서 보안그룹으로 막기 위한 것이라 로컬에서는 번거롭기만 하다.
management:
  server:
    port: ${MANAGEMENT_PORT:}
  endpoint:
    health:
      # 로컬에서는 DB·Redis 연결 상태를 바로 보는 편이 편하다.
      show-details: always
