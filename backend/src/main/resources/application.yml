spring:
  profiles:
    include: secret
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB      # 파일 한 개당 최대 용량 제한 (기본값: 1MB)
      max-request-size: 100MB   # 한 번의 요청(여러 파일 합계)당 최대 용량 제한 (기본값: 10MB)

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: vintic-mvp-bucket-123
    region:
      static: ap-northeast-2

openai:
  api:
    key: ${OPENAI_API_KEY}

# Vision 3단계 분석의 단계별 호출 옵션.
# detail은 정확도와 비용을 정면으로 맞바꾸는 값이다 - low는 이미지를 512px로 줄여 고정 비용만 쓰고,
# high는 512px 타일로 쪼개 타일당 추가 비용을 쓴다. 실루엣은 줄여도 알아볼 수 있어 low로 두고,
# 라벨 글자를 읽어야 하는 2·3단계만 high로 둔다. (이 설정이 값을 하는지는 하네스로 측정 중)
vision:
  stage:
    silhouette:
      detail: ${VISION_DETAIL_SILHOUETTE:low}
      max-output-tokens: 900
    label:
      detail: ${VISION_DETAIL_LABEL:high}
      max-output-tokens: 900
    condition:
      detail: ${VISION_DETAIL_CONDITION:high}
      max-output-tokens: 1400

# Vision 분석 작업을 Worker에게 전달하는 Redis Stream 설정
analysis:
  stream:
    key: ${ANALYSIS_STREAM_KEY:ai:analysis:requests}
    group: ${ANALYSIS_STREAM_GROUP:ai-analysis-workers}
    consumer-prefix: ${ANALYSIS_STREAM_CONSUMER_PREFIX:worker}

# 추천용 상품 벡터 설정.
# 기동 시 백필은 벡터가 없는 상품 수만큼 임베딩을 호출하므로(유료) 기본은 꺼둔다.
# 이미 만들어진 벡터는 건너뛰므로, 한 번 채운 뒤에는 켜둬도 추가 비용이 없다.
recommendation:
  vector-backfill-on-startup: ${RECOMMENDATION_VECTOR_BACKFILL:false}

# AI 호출 기록 보관 설정.
# 응답 본문을 통째로 담고 있어 무한정 쌓아둘 수 없다. 디버깅에 필요한 기간만 남긴다.
ai:
  call-log:
    retention-days: ${AI_CALL_LOG_RETENTION_DAYS:30}
    cleanup-enabled: ${AI_CALL_LOG_CLEANUP_ENABLED:true}

# Actuator 노출 범위.
#
# 기본값(전체 노출)을 쓰지 않는다. env는 환경변수를, configprops는 설정값을 그대로 뱉어서
# API 키가 인증 없이 읽힌다. 필요한 것만 골라 연다.
#
# 환경변수로 뺀 이유: 배포 서버에서 무엇을 열지는 배포를 맡은 쪽이 정해야 한다.
# 코드에 박아두면 노출 범위를 바꾸려고 재배포를 해야 한다.
# metrics는 호출 수·실패율·latency 분포를 담고 있어 운영 정보가 드러난다.
# 외부에 열려면 인증을 앞에 두거나, 내부망에서만 접근 가능해야 한다.
management:
  server:
    # 관리 엔드포인트를 서비스 포트와 분리한다.
    #
    # 앱 앞에 리버스 프록시가 없어서 경로 단위로 접근을 막을 지점이 없다. 포트를 나누면
    # 보안그룹에서 서비스 포트(8080)만 열고 관리 포트는 닫는 식으로 네트워크 레벨에서
    # 가를 수 있다. 애플리케이션 코드는 건드리지 않는다.
    #
    # 로컬에서는 분리할 이유가 없어 application-local.yml에서 되돌린다.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      # DB·Redis 연결 상태까지 보려면 상세 정보가 필요하다. 내부 구성이 드러난다.
      # 관리 포트를 보안그룹으로 막았다면 always로 올려도 되지만, 기본값은 보수적으로 둔다.
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when-authorized}
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.vintic.backend: INFO