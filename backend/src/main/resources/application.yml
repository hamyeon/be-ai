spring:
  profiles:
    include: secret
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB      # 파일 한 개당 최대 용량 제한 (기본값: 1MB)
      max-request-size: 100MB   # 한 번의 요청(여러 파일 합계)당 최대 용량 제한 (기본값: 10MB)

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: vintic-mvp-bucket-123
    region:
      static: ap-northeast-2

openai:
  api:
    key: ${OPENAI_API_KEY}

# Vision 3단계 분석의 단계별 호출 옵션.
# detail은 정확도와 비용을 정면으로 맞바꾸는 값이다 - low는 이미지를 512px로 줄여 고정 비용만 쓰고,
# high는 512px 타일로 쪼개 타일당 추가 비용을 쓴다. 실루엣은 줄여도 알아볼 수 있어 low로 두고,
# 라벨 글자를 읽어야 하는 2·3단계만 high로 둔다. (이 설정이 값을 하는지는 하네스로 측정 중)
vision:
  stage:
    silhouette:
      detail: ${VISION_DETAIL_SILHOUETTE:low}
      max-output-tokens: 900
    label:
      detail: ${VISION_DETAIL_LABEL:high}
      max-output-tokens: 900
    condition:
      detail: ${VISION_DETAIL_CONDITION:high}
      max-output-tokens: 1400

# Vision 분석 작업을 Worker에게 전달하는 Redis Stream 설정
analysis:
  stream:
    key: ${ANALYSIS_STREAM_KEY:ai:analysis:requests}
    group: ${ANALYSIS_STREAM_GROUP:ai-analysis-workers}
    consumer-prefix: ${ANALYSIS_STREAM_CONSUMER_PREFIX:worker}

# 추천용 상품 벡터 설정.
# 기동 시 백필은 벡터가 없는 상품 수만큼 임베딩을 호출하므로(유료) 기본은 꺼둔다.
# 이미 만들어진 벡터는 건너뛰므로, 한 번 채운 뒤에는 켜둬도 추가 비용이 없다.
recommendation:
  vector-backfill-on-startup: ${RECOMMENDATION_VECTOR_BACKFILL:false}

# Auction lifecycle scheduler(#73-3). SCHEDULED->LIVE(startAt 도달)/LIVE->ENDED(endAt 도달)
# 전환 + 시작 시 RESERVED AutoBid 정산(#73-1)/종료 시 #56 AuctionSettlementService 연결(#73-2)을
# 주기적으로 trigger한다. 기본은 꺼둔다 - 이유는 아래 payment.expiration과 동일하다(이 프로젝트의
# MySqlIT 다수가 @ActiveProfiles("local")을 데이터소스 설정 모양만 빌려 쓰는데, 기본 활성화하면
# 그 테스트들의 @SpringBootTest 컨텍스트에도 스케줄러가 함께 떠서 실제로 다른 테스트를 건드리는
# 것을 #57-2에서 확인했다 - 동일한 이유로 여기도 opt-in). batch-size는 두 스케줄러가 공유한다 -
# 별도 batch framework 없이 기존 Pageable 기반 페이지네이션(findEndingSoon/findPopular와 동일
# 관례)을 그대로 재사용한다.
auction:
  lifecycle:
    batch-size: ${AUCTION_LIFECYCLE_BATCH_SIZE:100}
    start:
      cron: ${AUCTION_START_CRON:0 * * * * *}
      enabled: ${AUCTION_START_ENABLED:false}
    end:
      cron: ${AUCTION_END_CRON:0 * * * * *}
      enabled: ${AUCTION_END_ENABLED:false}

# 결제 기한 만료 페널티 정책.
# 회차별 escalating 없이 고정 기간만 적용한다(#57-2 사용자 확정) - FINAL contract §14가
# "회차별 제재 기간 정책은 서버 설정으로 관리한다"고만 명시하고 구체적인 값은 계약에 고정하지
# 않아, 코드에 하드코딩하지 않고 여기로 뺐다.
penalty:
  bid-restriction-days: ${PENALTY_BID_RESTRICTION_DAYS:7}

# 결제 기한 만료 scheduler(#57-2). PAYMENT_PENDING Order 중 paymentDeadline이 지난 것만 대상.
# 기본은 꺼둔다(recommendation.vector-backfill-on-startup/ai.call-log.cleanup-enabled와 동일한
# 이유) - 이 프로젝트의 MySqlIT 다수가 @ActiveProfiles("local")을 데이터소스 설정 모양만
# 빌리는 용도로 재사용한다(#56-3 harness부터의 기존 관례). 기본 활성화하면 그 테스트들의
# @SpringBootTest 컨텍스트에도 이 스케줄러가 함께 뜨는데, 1분 주기 cron이 여러 테스트 클래스가
# 순차 실행되는 동안(수 분) 우연히 겹쳐 실제로 다른 테스트의 fixture를 건드리는 것을 확인했다
# (ALTER TABLE ... CHECK (1=0) 강제 실패 테스트가 스케줄러가 먼저 넣은 row 때문에 ALTER 자체가
# 실패). 기존 테스트 파일 13개를 전부 고치는 대신(스코프 확대), 이 프로젝트가 이미 쓰는
# "위험한 백그라운드 작업은 기본 꺼두고 명시적으로 켠다" 패턴을 그대로 따른다 - 실제 local 서버로
# 시연하려면 PAYMENT_EXPIRATION_ENABLED=true BACKUP_OFFER_EXPIRATION_ENABLED=true를 켜야 한다.
payment:
  expiration:
    cron: ${PAYMENT_EXPIRATION_CRON:0 * * * * *}
    enabled: ${PAYMENT_EXPIRATION_ENABLED:false}

# 차순위 제안 만료 scheduler(#56 deferred, #57-2에서 구현). WAITING BackupOffer 중 deadline이
# 지난 것만 대상 - Penalty는 만들지 않는다(User.noshowCount는 Order 만료에서만 갱신). 기본
# 비활성 이유는 바로 위 payment.expiration과 동일하다.
backup-offer:
  expiration:
    cron: ${BACKUP_OFFER_EXPIRATION_CRON:0 * * * * *}
    enabled: ${BACKUP_OFFER_EXPIRATION_ENABLED:false}

# #57-2 결제 기한 만료 시연용 seed(local 전용, LocalExpiredOrderSeeder). 기본 비활성 이유는
# 위 payment.expiration과 동일 - 명시적으로 켜야 한다.
local:
  expired-order-seed:
    enabled: ${LOCAL_EXPIRED_ORDER_SEED_ENABLED:false}

# AI 호출 기록 보관 설정.
# 응답 본문을 통째로 담고 있어 무한정 쌓아둘 수 없다. 디버깅에 필요한 기간만 남긴다.
ai:
  call-log:
    retention-days: ${AI_CALL_LOG_RETENTION_DAYS:30}
    cleanup-enabled: ${AI_CALL_LOG_CLEANUP_ENABLED:true}

# Actuator 노출 범위.
#
# 기본값(전체 노출)을 쓰지 않는다. env는 환경변수를, configprops는 설정값을 그대로 뱉어서
# API 키가 인증 없이 읽힌다. 필요한 것만 골라 연다.
#
# 환경변수로 뺀 이유: 배포 서버에서 무엇을 열지는 배포를 맡은 쪽이 정해야 한다.
# 코드에 박아두면 노출 범위를 바꾸려고 재배포를 해야 한다.
# metrics는 호출 수·실패율·latency 분포를 담고 있어 운영 정보가 드러난다.
# 외부에 열려면 인증을 앞에 두거나, 내부망에서만 접근 가능해야 한다.
management:
  server:
    # 관리 엔드포인트를 서비스 포트와 분리한다.
    #
    # 앱 앞에 리버스 프록시가 없어서 경로 단위로 접근을 막을 지점이 없다. 포트를 나누면
    # 보안그룹에서 서비스 포트(8080)만 열고 관리 포트는 닫는 식으로 네트워크 레벨에서
    # 가를 수 있다. 애플리케이션 코드는 건드리지 않는다.
    #
    # 로컬에서는 분리할 이유가 없어 application-local.yml에서 되돌린다.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      # DB·Redis 연결 상태까지 보려면 상세 정보가 필요하다. 내부 구성이 드러난다.
      # 관리 포트를 보안그룹으로 막았다면 always로 올려도 되지만, 기본값은 보수적으로 둔다.
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when-authorized}
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.vintic.backend: INFO

# #75-4A: 자체 Access/Refresh JWT. secret은 여기 기본값을 두지 않는다 - JWT_SECRET이 없으면
# 기동이 실패해야 한다(AWS_ACCESS_KEY_ID/OPENAI_API_KEY와 동일 원칙, application-secret.yml에도
# 실제 값을 넣지 않는다). TTL 기본값(access 30분/refresh 14일)은 이번 개발 단계 기본값이다.
jwt:
  secret: ${JWT_SECRET}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:1800}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}

---
# #75-4B: local/test(그리고 profile을 지정하지 않는 대부분의 @WebMvcTest 슬라이스, on-profile
# "!dev & !prod"에 해당)에서는 spring-boot-starter-security(#75-4A에서 JWT primitive용으로 추가)의
# 기본 auto-configuration을 아예 배제한다. 그러지 않으면 이 profile들에는 SecurityFilterChain
# 빈이 없어(JwtSecurityConfig는 dev/prod 전용) Boot가 모든 요청에 HTTP Basic 인증을 강제하는
# 기본 필터체인을 자동 생성하고, 기존 MockAuthInterceptor 기반 요청과 기존 컨트롤러 테스트가
# 전부 막힌다. dev/prod에서는 이 문서가 비활성화되어(on-profile 불일치) Security auto-configuration이
# 그대로 살아있고, JwtSecurityConfig가 제공하는 SecurityFilterChain이 Boot의 기본값을 대체한다.
spring:
  config:
    activate:
      on-profile: "!dev & !prod"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # #75-5B: SecurityAutoConfiguration을 빼면 HttpSecurity 빈이 없어지는데, actuator의
      # ManagementWebSecurityAutoConfiguration은 여전히 활성화되어 그 빈을 요구한다 -
      # spring-boot-starter-security를 추가하기 전(#75-4A 이전)에는 Security 클래스가
      # classpath에 없어 이 auto-configuration 자체가 조건에 걸려 매치되지 않았으므로
      # 드러나지 않았던 문제다. 이것도 함께 빼야 local/test @SpringBootTest context가 뜬다.
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration