name: PR checks

# main으로 향하는 PR에서 테스트/빌드만 실행한다. 배포는 이 workflow의 책임이 아니다(deploy.yml
# 참고) - 여기서는 AWS 자격증명이 전혀 필요 없다.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      TZ: Asia/Seoul
      # 테스트는 실제 OpenAI/Kakao를 호출하지 않는다(단위 테스트는 목, MySqlIT는 목 주입) -
      # 이 값들은 그저 Spring 기동에 필요한 필수 프로퍼티(application.yml의 ${...} 기본값 없음)를
      # 채우기 위한 플레이스홀더다. 실제 키가 아니다.
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      JWT_SECRET: ci-placeholder-jwt-secret-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build
        run: ./gradlew --no-daemon build -x test
